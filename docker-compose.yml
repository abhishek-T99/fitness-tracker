name: fittrack

x-backend-base: &backend-base
  build:
    context: ./backend
  image: fittrack-backend:latest
  environment:
    SECRET_KEY: ${SECRET_KEY:-dev-insecure-key-change-me}
    DEBUG: ${DEBUG:-True}
    ALLOWED_HOSTS: localhost,127.0.0.1,backend
    CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    DB_NAME: ${DB_NAME:-fittrack}
    DB_USER: ${DB_USER:-fittrack}
    DB_PASSWORD: ${DB_PASSWORD:-fittrack}
    DB_HOST: postgres
    DB_PORT: "5432"
  volumes:
    - ./backend:/app
    - media:/app/media
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fittrack}
      POSTGRES_USER: ${DB_USER:-fittrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fittrack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fittrack} -d ${DB_NAME:-fittrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend-base
    container_name: fittrack-backend
    command: ["bash", "/usr/local/bin/entrypoint.sh", "web"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend-base
    container_name: fittrack-worker
    command: ["bash", "/usr/local/bin/entrypoint.sh", "worker"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  beat:
    <<: *backend-base
    container_name: fittrack-beat
    command: ["bash", "/usr/local/bin/entrypoint.sh", "beat"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    image: fittrack-frontend:latest
    container_name: fittrack-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the image's installed node_modules from being
      # shadowed by the host bind mount.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  media:
