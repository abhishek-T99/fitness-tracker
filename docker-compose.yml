name: fittrack

x-backend-base: &backend-base
  build:
    context: ./backend
  image: fittrack-backend:latest
  env_file: .env
  volumes:
    - ./backend:/app
    - media:/app/media
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend-base
    container_name: fittrack-backend
    command: ["bash", "/usr/local/bin/entrypoint.sh", "web"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend-base
    container_name: fittrack-worker
    command: ["bash", "/usr/local/bin/entrypoint.sh", "worker"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  beat:
    <<: *backend-base
    container_name: fittrack-beat
    command: ["bash", "/usr/local/bin/entrypoint.sh", "beat"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    image: fittrack-frontend:latest
    container_name: fittrack-frontend
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the image's installed node_modules from being
      # shadowed by the host bind mount.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  media:
