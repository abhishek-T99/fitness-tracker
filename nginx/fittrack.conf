# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name fitnesstracker.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fitnesstracker.local;

    ssl_certificate     /etc/nginx/certs/fitnesstracker.local.crt;
    ssl_certificate_key /etc/nginx/certs/fitnesstracker.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Allow larger uploads (profile avatars, food images, etc.)
    client_max_body_size 20M;

    # Django: API, admin UI, collected static files, user-uploaded media
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite dev server — forward everything else including WebSocket for HMR
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket upgrade headers (required for Vite HMR)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
