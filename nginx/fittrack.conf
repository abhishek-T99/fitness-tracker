# Conditionally upgrade HTTP connections to WebSocket (used by Flower's event stream).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name fittrack.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fittrack.local;

    ssl_certificate     /etc/nginx/certs/fittrack.local.crt;
    ssl_certificate_key /etc/nginx/certs/fittrack.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Allow larger uploads (profile avatars, food images, etc.)
    client_max_body_size 20M;

    # Django: API, admin UI, collected static files, user-uploaded media
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Flower — only reachable when the monitoring profile is active.
    # The resolver + variable trick lets nginx start even when the flower
    # container doesn't exist; DNS is resolved lazily per request instead
    # of at startup.
    location /flower/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $flower_upstream http://flower:5555;
        proxy_pass         $flower_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_redirect     off;
    }

    # Vite dev server — forward everything else including WebSocket for HMR
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket upgrade headers (required for Vite HMR)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
