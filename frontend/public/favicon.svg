<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="64" height="32" rx="14" fill="url(#shine)"/>

  <!-- Dumbbell, centered -->
  <!-- Left weight plate -->
  <rect x="6" y="20" width="9" height="24" rx="3" fill="white"/>
  <!-- Left collar -->
  <rect x="15" y="24" width="5" height="16" rx="2" fill="rgba(255,255,255,0.75)"/>
  <!-- Bar -->
  <rect x="20" y="27" width="24" height="10" rx="2.5" fill="white"/>
  <!-- Right collar -->
  <rect x="44" y="24" width="5" height="16" rx="2" fill="rgba(255,255,255,0.75)"/>
  <!-- Right weight plate -->
  <rect x="49" y="20" width="9" height="24" rx="3" fill="white"/>

  <!-- Upward trend line — three dots bottom-right, suggests progress tracking -->
  <circle cx="34" cy="53" r="2.2" fill="rgba(255,255,255,0.55)"/>
  <circle cx="42" cy="49" r="2.2" fill="rgba(255,255,255,0.75)"/>
  <circle cx="50" cy="44" r="2.2" fill="rgba(255,255,255,0.95)"/>
</svg>
